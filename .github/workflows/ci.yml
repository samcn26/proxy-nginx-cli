name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./bin/pn --help
      - run: ./bin/pn --help cn
      - run: ./bin/pn network --help
      - run: npm pack --dry-run
      - name: Scan for owner-specific strings
        run: |
          if grep -rIn "jest[a]r" --exclude-dir=node_modules --exclude-dir=.git --exclude=AGENTS.md --exclude=package-lock.json .; then
            echo "owner-specific string found"; exit 1
          fi

  docker:
    # Builds the generated project with real Docker, tests every site type with nginx -t,
    # and exercises zero-downtime apply, rollback on invalid config, and removal.
    runs-on: ubuntu-latest
    env:
      PN: ${{ github.workspace }}/bin/pn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate a project with every site type
        run: |
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          "$PN" init
          "$PN" add app.example.test 127.0.0.1:3000 --www --redirect-aliases
          "$PN" add api.example.test https://10.0.0.6:8443 --alias api2.example.test --allow 10.0.0.0/8 --max-body-size 10m --timeout 60 --access-log --hsts-subdomains
          "$PN" add plain.example.test 127.0.0.1:3000 --no-ssl
          "$PN" add docs.example.test --template static
          "$PN" add spa.example.test --template spa --no-ssl
          "$PN" add old.example.test https://new.example.test --template redirect
          "$PN" template list

      - name: Compose file is valid and pinned images exist
        working-directory: ${{ runner.temp }}/proj
        run: |
          docker compose config -q
          docker compose pull certbot
          docker compose build proxy-nginx

      - name: nginx -t on the generated configuration
        working-directory: ${{ runner.temp }}/proj
        run: docker compose run --rm -T --no-deps proxy-nginx nginx -t

      - name: Run proxy, apply changes without restart, roll back, remove
        working-directory: ${{ runner.temp }}/proj
        run: |
          set -eux
          python3 -m http.server 3000 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 1
          "$PN" up
          # nginx -s reload only signals the master; give the new workers a moment.
          expect() {
            want=$1; shift
            for _ in $(seq 1 30); do
              got=$(curl -s -o /dev/null -w '%{http_code}' "$@" || true)
              if [ "$got" = "$want" ]; then return 0; fi
              sleep 0.5
            done
            echo "expected HTTP $want, got $got for: $*"
            return 1
          }

          started=$(docker inspect -f '{{.State.StartedAt}}' proxy-nginx)

          # Add a site with --run: reachable, container not restarted.
          "$PN" add live.example.test 127.0.0.1:3000 --no-ssl --run
          expect 200 -H 'Host: live.example.test' http://127.0.0.1/
          test "$(docker inspect -f '{{.State.StartedAt}}' proxy-nginx)" = "$started"

          # HTTPS with the generated self-signed certificate.
          "$PN" add secure.example.test 127.0.0.1:3000 --run
          expect 200 -k --resolve secure.example.test:443:127.0.0.1 https://secure.example.test/

          # Static site and unknown host.
          "$PN" add files.example.test --template static --no-ssl --run
          expect 200 -H 'Host: files.example.test' http://127.0.0.1/
          curl -fsS -H 'Host: files.example.test' http://127.0.0.1/ | grep -q files.example.test
          expect 404 -H 'Host: nobody.example.test' http://127.0.0.1/

          # An invalid template must not break the running proxy.
          echo 'bogus_directive on;' >> nginx/templates/live.example.test.conf.template
          if "$PN" add other.example.test 127.0.0.1:3000 --no-ssl --run; then echo "expected failure"; exit 1; fi
          if "$PN" restart; then echo "expected failure"; exit 1; fi
          expect 200 -H 'Host: live.example.test' http://127.0.0.1/
          test "$(docker inspect -f '{{.State.StartedAt}}' proxy-nginx)" = "$started"

          # Fix it, remove a site, status --json.
          sed -i '/bogus_directive/d' nginx/templates/live.example.test.conf.template
          "$PN" remove live.example.test --run
          expect 404 -H 'Host: live.example.test' http://127.0.0.1/
          "$PN" status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["proxy"]["running"]; assert any(s["domain"]=="secure.example.test" for s in d["sites"])'

          # Log rotation hook is installed and runs.
          docker exec proxy-nginx sh -c 'ls /docker-entrypoint.d/ && LOG_ROTATE_SIZE_MB=1000 sh /docker-entrypoint.d/60-rotate-logs.sh --once'

      - name: Logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/proj
        run: docker compose logs --tail 100 proxy-nginx || true
